name: Build system image (manual)

# Builds the ready-made FamHomeBase system image (tools/build-image.sh) for a display release that already exists. MANUAL ONLY: the running
# display updates itself online, so an image is only needed when something on disk changes. Never runs on a tag or a push.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Display release to put in the image (X.Y.Z; its release and image must exist)"
        required: true
        type: string
      env:
        description: "prod is the real image; staging is for tests only (never published as the Imager list)"
        required: true
        type: choice
        options: [prod, staging]
        default: prod
      publish:
        description: "Publish the image as the release image-X.Y.Z (and, for prod, the Imager list as the release imager)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

# one image build or publish at a time: two runs must not race to create or replace the same release
concurrency:
  group: system-image
  cancel-in-progress: false

jobs:
  build:
    # a 64-bit ARM runner: the build runs the image's own programs in a chroot, with no emulation (free for public repositories)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      VERSION: ${{ inputs.version }}
      TARGET_ENV: ${{ inputs.env }}
      PUBLISH: ${{ inputs.publish }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the inputs
        run: |
          case "$VERSION" in ''|*[!0-9.]*) echo "version must look like 0.5.10"; exit 1 ;; esac
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "version must look like 0.5.10"; exit 1; }
          gh release view "v$VERSION" --repo "$REPO" >/dev/null || { echo "release v$VERSION of this repository does not exist"; exit 1; }
          # a staging image talks to the staging cloud: it is a test build and must never become a public release
          if [ "$PUBLISH" = true ] && [ "$TARGET_ENV" != prod ]; then echo "only the prod image can be published (run staging without publish)"; exit 1; fi
          # the Imager list is replaced with every prod publish: only the newest display release may do that
          if [ "$PUBLISH" = true ]; then
            newest=$(gh release view --repo "$REPO" --json tagName -q .tagName)
            [ "$newest" = "v$VERSION" ] || { echo "v$VERSION is not the newest display release ($newest): publishing would replace the customers' Imager list with an older image"; exit 1; }
          fi

      - name: Tools and disk space
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q zerofree parted xz-utils e2fsprogs curl util-linux
          # the build needs about 10 GB: take back what the runner image carries that we do not use
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache 2>/dev/null || true
          df -h /
          avail=$(df --output=avail -k / | tail -n 1)
          [ "$avail" -ge 9000000 ] || { echo "only $avail KB free: the build needs about 9 GB"; exit 1; }

      - name: Build the image
        run: |
          mkdir -p dist
          sudo sh tools/build-image.sh --version "$VERSION" --env "$TARGET_ENV" --out "$PWD/dist" \
            --url "https://github.com/$REPO/releases/download/image-$VERSION/famhomebase-$VERSION-$TARGET_ENV-arm64.img.xz"
          sudo chown -R "$(id -u):$(id -g)" dist
          ls -l dist

      - name: Check the result
        run: |
          cd dist
          img="famhomebase-$VERSION-$TARGET_ENV-arm64.img.xz"
          list="famhomebase-$VERSION-$TARGET_ENV-arm64.os_list.json"
          sha256sum -c "$img.sha256"
          size=$(wc -c < "$img")
          echo "image size: $size bytes"
          if [ "$size" -le 300000000 ] || [ "$size" -ge 1500000000 ]; then echo "the image is outside the expected 0.3 to 1.5 GB: something is wrong"; exit 1; fi
          xz -t "$img"
          # the Imager list must parse, name this release's image, and carry this image's real size and checksum
          python3 - "$img" "$list" "$REPO" "$VERSION" "$TARGET_ENV" <<'PY'
          import hashlib, json, os, sys
          img, listfile, repo, version, env = sys.argv[1:6]
          entry = json.load(open(listfile))["os_list"][0]
          want_url = f"https://github.com/{repo}/releases/download/image-{version}/{img}"
          sha = hashlib.sha256(open(img, "rb").read()).hexdigest()
          problems = []
          if entry["url"] != want_url: problems.append(f"url is {entry['url']}, expected {want_url}")
          if entry["image_download_sha256"] != sha: problems.append("image_download_sha256 does not match the image")
          if entry["image_download_size"] != os.path.getsize(img): problems.append("image_download_size does not match the image")
          if entry["init_format"] != "cloudinit-rpi": problems.append("init_format is not cloudinit-rpi")
          if not entry["extract_size"] > 1000000000: problems.append("extract_size looks wrong")
          if problems:
              print("\n".join(problems)); sys.exit(1)
          print("the Imager list matches the image")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: famhomebase-image-${{ inputs.version }}-${{ inputs.env }}
          path: dist/
          retention-days: 7

      - name: Publish the image
        if: ${{ inputs.publish }}
        run: |
          img="dist/famhomebase-$VERSION-$TARGET_ENV-arm64.img.xz"
          notes="FamHomeBase display $VERSION ($TARGET_ENV) as a ready-made system image for a Raspberry Pi 4 or 5, written with Raspberry Pi Imager: see docs/INSTALL.md. Built by hand-started CI: display release v$VERSION, build tools at commit ${GITHUB_SHA::7}."
          # never the repository's "latest" release: the install command and the updater look at the display releases
          if gh release view "image-$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "image-$VERSION" "$img" "$img.sha256" --clobber --repo "$REPO"
          else
            gh release create "image-$VERSION" "$img" "$img.sha256" --repo "$REPO" --target "$GITHUB_SHA" --title "System image $VERSION" --notes "$notes" --latest=false
          fi

      - name: Publish the Imager list (prod only)
        if: ${{ inputs.publish && inputs.env == 'prod' }}
        run: |
          cp "dist/famhomebase-$VERSION-prod-arm64.os_list.json" imager.json
          if ! gh release view imager --repo "$REPO" >/dev/null 2>&1; then
            gh release create imager --repo "$REPO" --title "Imager list" --notes "The list Raspberry Pi Imager reads to offer the FamHomeBase image. Replaced with every image." --latest=false
          fi
          gh release upload imager imager.json --clobber --repo "$REPO"
