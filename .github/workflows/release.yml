name: Release

# Runs when a vX.Y.Z tag lands on this repo. The app repo's release workflow publishes the image famhomebase-pi:X.Y.Z for the same version
# first (tag vX.Y.Z there), so by the time this runs the image exists. It builds the host payload:
#   famhomebase-pi-X.Y.Z.tar.gz         lib/, doc/, famhomebase.env.example, VERSION (the update script applies it together with the image)
#   famhomebase-pi-X.Y.Z.tar.gz.sha256  its checksum (the installer and the update script both verify it)
#   install.sh                          the installer, at .../releases/latest/download/install.sh
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag
        run: echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::tag must look like v0.2.0"; exit 1; }
      - uses: actions/checkout@v4

      - name: Test the scripts that ship
        run: |
          sh tests/test-run.sh
          sh tests/test-host-setup.sh
          sh tests/test-update.sh
          sh tests/test-install.sh
          sh tests/test-kiosk.sh
          sh tests/test-famhomebase.sh
          sh tests/test-splash.sh

      - name: Check the image this release needs exists
        run: |
          version="${GITHUB_REF_NAME#v}"
          image=famhomebase-pi
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:mcesolutionsinc/$image:pull" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/mcesolutionsinc/$image/manifests/$version")
          if [ "$code" != 200 ]; then
            echo "::error::$image:$version is not publicly pullable (HTTP $code): a release that needs it would not start. Is the app repo's v$version build finished, and is the package public?"
            exit 1
          fi

      - name: Build the payload
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          name="famhomebase-pi-$version"
          stage=$(mktemp -d)
          mkdir "$stage/lib" "$stage/doc"
          cp scripts/run.sh scripts/host-setup.sh scripts/update.sh scripts/kiosk.sh scripts/splash.sh scripts/famhomebase "$stage/lib/"
          cp -R assets/splash "$stage/lib/splash"
          cp famhomebase.env.example "$stage/famhomebase.env.example"
          cp README.md LICENSE docs/INSTALL.md docs/TROUBLESHOOTING.md "$stage/doc/"
          echo "$version" > "$stage/VERSION"
          mkdir dist
          # named entries, not "." : an entry for the folder itself would reset the install folder's mode and owner when it is unpacked
          tar -czf "dist/$name.tar.gz" -C "$stage" lib doc famhomebase.env.example VERSION
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          cp scripts/install.sh dist/install.sh
          ls -l dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "FamHomeBase display $version" \
            --generate-notes \
            --notes "Install with one command (see docs/INSTALL.md for the options):

          \`\`\`
          curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sudo sh -s -- --kiosk
          \`\`\`

          An install already running the update timer picks this release up by itself."
