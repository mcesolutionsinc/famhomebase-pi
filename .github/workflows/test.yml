name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the shell scripts and their tests
        run: shellcheck -s sh -S warning scripts/install.sh scripts/run.sh scripts/host-setup.sh scripts/update.sh scripts/kiosk.sh scripts/famhomebase scripts/splash.sh scripts/ready.sh scripts/warm.sh scripts/load-image.sh scripts/bootconfig.sh scripts/first-update.sh tools/build-image.sh tools/image-patches.sh tools/make-os-list.sh tests/test-*.sh
      - name: Test the container's start script
        run: sh tests/test-run.sh
      - name: Test the host setup
        run: sh tests/test-host-setup.sh
      - name: Test the updater
        run: sh tests/test-update.sh
      - name: Test the installer
        run: sh tests/test-install.sh
      - name: Test the kiosk launcher
        run: sh tests/test-kiosk.sh
      - name: Test the famhomebase command
        run: sh tests/test-famhomebase.sh
      - name: Test the boot splash
        run: sh tests/test-splash.sh
      - name: Test the ready wait
        run: sh tests/test-ready.sh
      - name: Test the file-cache warm-up
        run: sh tests/test-warm.sh
      - name: Test the first-boot image loader
        run: sh tests/test-load-image.sh
      - name: Test the first-boot update
        run: sh tests/test-first-update.sh
      - name: Test the boot-drive settings file
        run: sh tests/test-bootconfig.sh
      - name: Test the image build's checks
        run: sh tests/test-build-image.sh
      - name: Test the image's file edits
        run: sh tests/test-image-patches.sh
      - name: Test the Imager list writer
        run: sh tests/test-make-os-list.sh
