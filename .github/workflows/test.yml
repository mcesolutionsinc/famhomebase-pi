name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the shell scripts and their tests
        run: shellcheck -s sh -S warning scripts/install.sh scripts/run.sh scripts/host-setup.sh scripts/update.sh scripts/kiosk.sh scripts/famhomebase scripts/splash.sh tests/test-*.sh
      - name: Test the container's start script
        run: sh tests/test-run.sh
      - name: Test the host setup
        run: sh tests/test-host-setup.sh
      - name: Test the updater
        run: sh tests/test-update.sh
      - name: Test the installer
        run: sh tests/test-install.sh
      - name: Test the kiosk launcher
        run: sh tests/test-kiosk.sh
      - name: Test the famhomebase command
        run: sh tests/test-famhomebase.sh
      - name: Test the boot splash
        run: sh tests/test-splash.sh
