# The FamHomeBase wall display for the CLOUD service: one container, no sidecar, no key, no data folder. Nothing here touches
# the running Pi line (docker-compose.yml, the famhomebase-pi images); this is a separate project with its own image name.
# See docs/CLOUD.md. Not for a Pi's auto-updater: that follows the other compose file and the v* releases only.
#
#   FAMHOMEBASE_CLOUD_IMAGE=famhomebase-pi-cloud:local docker compose -f docker-compose.cloud.yml up -d     # an image you built
#   FAMHOMEBASE_CLOUD_VERSION=0.1.0 docker compose -f docker-compose.cloud.yml up -d                       # a published one
#   open http://localhost:8080/        (add ?kiosk=1 to hide the mouse pointer, as on the wall)

name: famhomebase-cloud

services:
  display:
    # No `latest` on purpose: a version has to be named, so a display never changes under you.
    image: ${FAMHOMEBASE_CLOUD_IMAGE:-ghcr.io/mcesolutionsinc/famhomebase-pi-cloud:${FAMHOMEBASE_CLOUD_VERSION:?set FAMHOMEBASE_CLOUD_VERSION (for example 0.1.0) or FAMHOMEBASE_CLOUD_IMAGE}}
    ports:
      - "${FAMHOMEBASE_PORT:-8080}:8080"
    environment:
      # Where the cloud is: production unless you say otherwise. A phone scanning the QR code opens the same address.
      - FAMHOMEBASE_API_URL=${FAMHOMEBASE_API_URL:-https://famhomebase.mc-esolutions.ca}
      # prod or staging (staging shows a STAGING banner)
      - FAMHOMEBASE_ENV=${FAMHOMEBASE_ENV:-prod}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/runtime-config.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
