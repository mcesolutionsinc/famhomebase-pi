# FamHomeBase on a Raspberry Pi (or any 64-bit Linux box with Docker). See https://github.com/mcesolutionsinc/famhomebase-pi/blob/main/docs/INSTALL.md.
#
#   ./scripts/generate-key.sh        # once, before the first start
#   docker compose up -d
#   open http://<this-machine>:8080/?kiosk=1      (the display; 8080 unless you set FAMHOMEBASE_PORT)
#   open http://<this-machine>:8080/              (manage it from a phone or laptop)

name: famhomebase-pi

services:
  app:
    # A release install pins this to the release's own version (the payload's compose file has it stamped in); a plain
    # git clone follows `latest`. Override with FAMHOMEBASE_VERSION in .env.
    image: ghcr.io/mcesolutionsinc/famhomebase-pi:${FAMHOMEBASE_VERSION:-latest}
    ports:
      # The left-hand number is the port you browse to. Set FAMHOMEBASE_PORT in .env to change it (80 gives http://<address>/).
      - "${FAMHOMEBASE_PORT:-8080}:8080"
    volumes:
      # The Unix socket the app container's web server uses to reach the configstore — not a network port.
      - configstore-socket:/run/famhomebase
    depends_on:
      configstore:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost: in the Alpine nginx image localhost can resolve to ::1 first, nginx listens on IPv4
      # only, and busybox wget doesn't fall back — so the container reported unhealthy while serving fine.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  configstore:
    image: ghcr.io/mcesolutionsinc/famhomebase-pi-configstore:${FAMHOMEBASE_VERSION:-latest}
    volumes:
      - configstore-socket:/run/famhomebase
      # Your settings and connected-account data live here, on the host. Survives upgrades. Back it up.
      - ./data:/data
    secrets:
      - dashboard_key
    environment:
      - CONFIGSTORE_KEY_PATH=/run/secrets/dashboard_key
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').request({socketPath:'/run/famhomebase/configstore.sock',path:'/health'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1)).end()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Keeps this install up to date: every few hours it checks GitHub for a newer release of famhomebase-pi and, if there
  # is one, installs it (pull, restart, health check, roll back if it doesn't come up). Turn it off with AUTO_UPDATE=false
  # in .env — it will then only log that a release is available. See docs/INSTALL.md ("Updating").
  #
  # It needs the Docker socket, which is effectively root on this machine: that is how any compose-based updater works.
  # The install folder is mounted at the same path inside and out so the relative paths in this file resolve the same
  # way for the updater's `docker compose` as for yours.
  updater:
    image: docker:27-cli
    restart: unless-stopped
    working_dir: ${FAMHOMEBASE_DIR:-${PWD}}
    entrypoint: ["sh", "./updater/update.sh"]
    environment:
      - FAMHOMEBASE_DIR=${FAMHOMEBASE_DIR:-${PWD}}
      - AUTO_UPDATE=${AUTO_UPDATE:-true}
      - CHECK_INTERVAL_HOURS=${CHECK_INTERVAL_HOURS:-6}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${FAMHOMEBASE_DIR:-${PWD}}:${FAMHOMEBASE_DIR:-${PWD}}

secrets:
  dashboard_key:
    # Created by ./scripts/generate-key.sh. Encrypts your connected-account tokens on disk.
    file: ./secrets/dashboard.key

volumes:
  configstore-socket:
